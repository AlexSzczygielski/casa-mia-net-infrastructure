# services.yaml
---
- Infrastructure:
    - Proxmox VE:
        href: https://192.168.0.5:8006
        description: Hypervisor host
        icon: proxmox.png
        widget:
          type: proxmox
          url: https://192.168.0.5:8006
          username: root@pam!homepage
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          node: pve
          verifySSL: false

    - Portainer:
        href: https://portainer.casamia-net.top
        description: Docker management
        icon: portainer.png
        widget:
          type: portainer
          url: https://portainer:9443
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"
          verifySSL: false

    - Uptime Kuma:
        href: https://uptime-kuma.casamia-net.top
        description: Uptime monitoring
        icon: uptime-kuma.png
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: homepage

    - Pi-hole:
        href: https://pihole.casamia-net.top/admin
        description: DNS ad-blocking
        icon: pi-hole.png
        widget:
          type: pihole
          url: http://pihole:80
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"

- Infrastructure Tailscale:
    - Portainer (Tailscale):
        href: https://portainer.ts.casamia-net.top
        description: Docker management, away from home
        icon: portainer.png

    - Uptime Kuma (Tailscale):
        href: https://uptime-kuma.ts.casamia-net.top
        description: Uptime monitoring, away from home
        icon: uptime-kuma.png

    - Pi-hole (Tailscale):
        href: https://pihole.ts.casamia-net.top/admin
        description: DNS ad-blocking, away from home
        icon: pi-hole.png

- Homelab:
    - GitHub Network Docs:
        href: https://github.com/AlexSzczygielski/casa-mia-network
        description: Homelab docs
        icon: github.png

    - GitHub Infra Repo:
        href: https://github.com/AlexSzczygielski/casa-mia-net-infrastructure
        description: Docker VM infrastructure config
        icon: github.png

    - Tailscale Admin:
        href: https://login.tailscale.com/admin/machines
        description: Tailnet device management
        icon: tailscale.png