# services.yaml
---
- Infrastructure:
    - Proxmox VE:
        href: https://192.168.0.5:8006
        description: Hypervisor host
        icon: proxmox.png
        widget:
          type: proxmox
          url: https://192.168.0.5:8006
          username: root@pam!homepage
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          node: pve
          verifySSL: false
        
    - Portainer:
        href: https://192.168.0.136:9443
        description: Docker management
        icon: portainer.png
        widget:
          type: portainer
          url: https://192.168.0.136:9443
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

    - Uptime Kuma:
        href: http://192.168.0.136:3001
        description: Uptime monitoring
        icon: uptime-kuma.png
        widget:
          type: uptimekuma
          url: http://192.168.0.136:3001
          slug: homepage
    
    - Pi-hole:
        href: http://192.168.0.136:8081/admin
        description: DNS ad-blocking
        icon: pi-hole.png
        widget:
          type: pihole
          url: http://192.168.0.136:8081
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"