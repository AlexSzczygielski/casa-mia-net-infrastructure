# docker-compose.yml (homepage)
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    env_file:
      - .env
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "192.168.0.136:3004,casamia-net.top,ts.casamia-net.top"
      PUID: 1000
      PGID: 1000
    group_add:
      - "989"
    ports:
      - "3004:3000"
    volumes:
      - ./config:/app/config
      - ./config/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
