# docker-compose.yml (pihole)
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"     # DNS
      - "53:53/udp"     # DNS
      - "8081:80/tcp"   # Web UI — kept off 80 so NPM can claim it later
    environment:
      TZ: "Europe/Warsaw"
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD}"
      FTLCONF_dns_listeningMode: "ALL"   # required on default bridge network
    volumes:
      - /opt/docker-data/pihole:/etc/pihole
    cap_add:
      - NET_ADMIN   # needed even without using Pi-hole as DHCP server
      - SYS_TIME
      - SYS_NICE
    restart: unless-stopped